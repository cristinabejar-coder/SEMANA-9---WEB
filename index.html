// --- DECLARACIÓN DE FUNCIONES ---

function mensaje(){
    echo "Bienvenidos a PHP";
}

function pon_tu_nombre($nombre){
    echo $nombre;
}

function con_parametros($var1, $var2, $var3) {
    $suma = $var1 + $var2 + $var3;
    echo "La suma de los tres numeros es: " . $suma . "<br/>";
}

function promedio($nt, $nee, $proy){
    $prom = ($nt + $nee + $proy) / 3;
    return $prom;
}

function saludo(string $saludo): string 
{
    return $saludo;
}

function separa() {
    echo "<hr/>";
}

function suma(float $n1, float $n2): float 
{
    $s = $n1 + $n2;
    return $s;
}

// 1. Calcular el cuadrado de un número
function calcularCuadrado(int $n1): int {
    $cuadrado = $n1 * $n1;
    return $cuadrado;
}

// 2. Calcular el producto de dos números
function producto(int $n1, int $n2): int {
    $producto = $n1 * $n2;
    return $producto;
}

// 3. Saludo por nombre
function Nombre($nombre) {
    return "Hola, " . htmlspecialchars($nombre) . ". Bienvenido.";
}

// 4. Evaluación de nota
function evaluarNota($nota) {
    if ($nota >= 13) {
        return "Felicitaciones";
    } else {
        return "Inténtalo en otra oportunidad!!!";
    }
}

// 5. Suma de dos números enteros
function sumarNumeros($numero1, $numero2) {
    return $numero1 + $numero2;
}

// 6. Módulo de Cálculo Financiero (IGV)
function calcularIgv(float $monto): float {
    return $monto * 0.18;
}

// 7. Generador de Código de Ticket
function generarCodigoTicket($categoria, $codigoSecundario) {
    $categoriaLimpia = ltrim($categoria);
    $categoriaMayus = strtoupper($categoriaLimpia);
    $codigoLimpio = rtrim($codigoSecundario);
    return $categoriaMayus . "-" . $codigoLimpio;
}

// 8. Normalización de Nombres Propios
function normalizarNombre($nombreCompleto) {
    $nombreLimpio = trim($nombreCompleto);
    $nombreMinusculas = strtolower($nombreLimpio);
    return ucwords($nombreMinusculas);
}

// 9. Área del Círculo
function calcularAreaCirculo($radio) {
    $area = pi() * pow($radio, 2);
    return number_format($area, 2);
}

// 10. Cálculo de Hipotenusa - Teorema de Pitágoras (SOLO DEBE ESTAR UNA VEZ)
function calcularHipotenusa($catetoA, $catetoB) {
    $hipotenusa = sqrt(pow($catetoA, 2) + pow($catetoB, 2));
    return number_format($hipotenusa, 2);
}

// 11. Generador de Marca de Tiempo y Fecha Completa
function obtenerInfoFechaHora() {
    date_default_timezone_set('America/Lima');
    return [
        'segundos' => time(),
        'fecha' => date("d/m/Y"),
        'hora' => date("h:i:s A")
    ];
}

// 12. Reloj Multizona Horaria
function obtenerHoraZona($zona) {
    date_default_timezone_set($zona);
    return [
        'formato24' => date("H:i:s"),
        'formato12' => date("h:i:s a")
    ];
}

  const sinImagen = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#cfe0f7"/></linearGradient></defs>' +
    '<rect width="100%" height="100%" fill="url(#g)"/><text x="50%" y="50%" text-anchor="middle" fill="#1f5fbf" ' +
    'font-family="Arial" font-size="24">Captura no disponible</text></svg>');

  const vistaMenu = document.getElementById("vista-menu");
  const vistaDetalle = document.getElementById("vista-detalle");

  // Menú: botones numerados
  const menu = document.getElementById("menu");
  casos.forEach((c, i) => {
    const col = document.createElement("div");
    col.className = "col-6 col-md-4 col-lg-3";
    col.innerHTML = `<button class="tarjeta-caso" onclick="irCaso('${c.id}')">${c.etiqueta}</button>`;
    menu.appendChild(col);
  });

  // La navegación NO depende de location.hash (en vistas previas con sandbox puede fallar).
  // Se intenta actualizar el hash solo como extra, dentro de try/catch.
  function irCaso(id) { mostrar(id); sincronizarHash(id); }
  function irMenu()   { mostrar(""); sincronizarHash(""); }

  function sincronizarHash(id) {
    try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {}
  }

  function subirArriba() {
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function mostrar(id) {
    const idx = casos.findIndex(c => c.id === id);

    if (idx < 0) {            // sin id o inválido -> menú
      vistaDetalle.classList.add("d-none");
      vistaMenu.classList.remove("d-none");
      subirArriba();
      return;
    }

    const c = casos[idx];
    document.getElementById("d-etiqueta").textContent = c.etiqueta;
    document.getElementById("d-titulo").textContent = c.titulo;
    document.getElementById("d-enunciado").textContent = c.enunciado;

    const code = document.getElementById("d-codigo");
    code.textContent = document.getElementById("codigo-" + c.id).value.trim();
    try { if (window.Prism && Prism.languages && Prism.languages.php) Prism.highlightElement(code); } catch (e) {}
    code.parentElement.scrollTop = 0;

    const img = document.getElementById("d-imagen");
    img.onerror = () => { img.onerror = null; img.src = sinImagen; };
    img.src = capturas[c.id] || ("img/" + c.id + ".png");
    img.alt = "Vista previa de " + c.etiqueta;

    const enlace = document.getElementById("d-enlace");
    if (c.enlace) { enlace.href = c.enlace; enlace.classList.remove("d-none"); }
    else { enlace.classList.add("d-none"); }

    const ant = document.getElementById("btn-ant");
    const sig = document.getElementById("btn-sig");
    ant.disabled = idx === 0;
    sig.disabled = idx === casos.length - 1;
    ant.onclick = () => irCaso(casos[idx - 1].id);
    sig.onclick = () => irCaso(casos[idx + 1].id);

    vistaMenu.classList.add("d-none");
    vistaDetalle.classList.remove("d-none");
    subirArriba();
  }

  // Botón "atrás" / enlaces con #caso01 (si el entorno permite leer el hash)
  window.addEventListener("hashchange", () => {
    try { mostrar(location.hash.replace("#", "")); } catch (e) {}
  });
  let inicial = "";
  try { inicial = location.hash.replace("#", ""); } catch (e) {}
  mostrar(inicial);
</script>
